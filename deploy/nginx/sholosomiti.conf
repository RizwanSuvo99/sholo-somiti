# sholosomiti.duckdns.org
#
# certbot --nginx rewrites this file to add the TLS server block and the
# redirect. What is here is the pre-certificate state.

server {
    listen 80;
    listen [::]:80;
    server_name sholosomiti.duckdns.org;

    # Served from disk so a renewal does not depend on the app being up.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Payment screenshots and member photos go to Cloudinary via the browser,
    # so nothing large passes through here — this is headroom, not a target.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app rate-limits the public endpoints per client address and reads
        # the first entry here, so it must be set or every visitor counts as one.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}
